[project]
name = "city-sdk"
version = "0.9.139"
description = "Milano Agentic City SDK: Market facade and agent harness (includes cap)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Project NANDA Italy" }]
keywords = ["agentic-city", "market", "cap", "nanda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2",
    "rfc8785>=0.1.4",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/projectnandaitaly/mach-hackathon-kit"
Repository = "https://github.com/projectnandaitaly/mach-hackathon-kit"
Documentation = "https://github.com/projectnandaitaly/mach-hackathon-kit/tree/main/docs"
Issues = "https://github.com/projectnandaitaly/mach-hackathon-kit/issues"

[project.scripts]
city-sdk = "city_sdk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/city_sdk", "src/cap"]
