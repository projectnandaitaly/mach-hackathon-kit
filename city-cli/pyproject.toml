[project]
name = "city-cli"
version = "0.9.188"
description = "Milano Agentic City CLI (city): init, dev, conform, and deploy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Project NANDA Italy" }]
keywords = ["agentic-city", "cli", "deploy", "nanda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "city-sdk>=0.9.188",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema[format]>=4.23",
    "pydantic>=2",
    "pyyaml>=6.0",
    "referencing>=0.35",
    "rfc8785>=0.1.4",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/projectnandaitaly/mach-hackathon-kit"
Repository = "https://github.com/projectnandaitaly/mach-hackathon-kit"
Documentation = "https://github.com/projectnandaitaly/mach-hackathon-kit/tree/main/docs"
Issues = "https://github.com/projectnandaitaly/mach-hackathon-kit/issues"

[project.scripts]
city = "city_deploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/city_deploy", "src/city_conform", "src/city_index", "src/city"]
# The sdist carries the repository .gitignore, which ignores *.json.
artifacts = ["src/city_deploy/schemas/**/*.json"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/city_deploy/schemas/**/*.json"]
